<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Terremoti Mondo - Anonimo News</title>

<link rel="stylesheet" href="css/stile.css">

</head>


<body>


<header>

<h1>🌍 Terremoti Mondo</h1>

<p>Eventi sismici rilevati da USGS</p>

</header>



<section>

<h2>🌋 Ultime scosse nel mondo</h2>


<div id="eventi-mondo">

Caricamento eventi mondiali...

</div>


</section>



<footer>

<a href="index.html">⬅ Torna Home</a>

</footer>



<script>

fetch("dati/mondo/eventi_mondo.json")

.then(response => response.json())

.then(eventi => {


let contenitore = document.getElementById("eventi-mondo");


contenitore.innerHTML = "";


eventi.forEach(evento => {


contenitore.innerHTML += `


<div class="scheda">


<h2>🌋 Magnitudo ${evento.magnitudo}</h2>


<p>📍 ${evento.luogo}</p>


<p>⬇️ Profondità: ${evento.profondita}</p>


<p>📅 Data: ${evento.data}</p>


<p>🕒 Ora: ${evento.ora}</p>


<p>📡 Fonte: ${evento.fonte}</p>


<p>🌐 Coordinate:
${evento.lat}, ${evento.lon}
</p>


</div>


`;


});


})


.catch(error => {


document.getElementById("eventi-mondo").innerHTML =
"Errore caricamento eventi USGS";


console.log(error);


});


</script>


</body>

</html>
