<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mappa Terremoti - Anonimo News</title>

<link rel="stylesheet" href="css/stile.css">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

#map {
    height: 600px;
    width: 90%;
    margin: 30px auto;
    border-radius: 15px;
}

</style>

</head>


<body>

<header>

<h1>🌍 Mappa Terremoti</h1>

<p>Eventi sismici Italia e Mondo</p>

</header>


<section>

<h2>📍 Epicentri rilevati</h2>

<div id="map"></div>


</section>


<footer>

<a href="index.html">⬅ Torna Home</a>

</footer>


<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>

var map = L.map('map').setView([20,0],2);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:18,
attribution:'© OpenStreetMap'
}
).addTo(map);



fetch("dati/eventi.json")

.then(response => response.json())

.then(eventi => {


eventi.forEach(evento => {


var lat = evento.lat;
var lon = evento.lon;


let magnitudo = parseFloat(evento.magnitudo);

let colore = "green";

if (magnitudo >= 6) {
    colore = "red";
} 
else if (magnitudo >= 5) {
    colore = "orange";
}
else if (magnitudo >= 3) {
    colore = "yellow";
}


let cerchio = L.circleMarker(
    [lat, lon],
    {
        radius: magnitudo * 4,
        color: colore,
        fillColor: colore,
        fillOpacity: 0.6
    }
).addTo(map);


cerchio.bindPopup(

`
<h3>🌋 Magnitudo ${evento.magnitudo}</h3>

📍 ${evento.luogo}<br>

⬇ Profondità: ${evento.profondita}<br>

📅 ${evento.data}<br>

🕒 ${evento.ora}<br>

📡 Fonte: ${evento.fonte}

`

);


});


});


</script>


</body>

</html>
